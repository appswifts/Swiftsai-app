version: '3.8'
services:
  editor:
    build: .
    container_name: swiftsai-editor
    restart: always
    ports:
      - "4201:4201"
    environment:
      PORT: 4201
      UNSPLASH_ACCESS_KEY: "${UNSPLASH_ACCESS_KEY:-}"
      GOOGLE_FONTS_API_KEY: "${GOOGLE_FONTS_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
    volumes:
      - editor-templates:/app/templates

volumes:
  editor-templates:
